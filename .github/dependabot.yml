#
# Dependabot owns GitHub Actions pins only. The weekly update-deps workflow
# owns the base image, HAProxy and upstream pins, because GITHUB_TOKEN cannot
# push changes under .github/workflows/ and Dependabot can.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Australia/Sydney
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
